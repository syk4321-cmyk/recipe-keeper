[build]
  command = "pnpm --filter @workspace/blank-react-app run build"
  publish = "artifacts/blank-react-app/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"
  PORT = "18404"
  # VITE_FIREBASE_API_KEY / VITE_FIREBASE_AUTH_DOMAIN / VITE_FIREBASE_PROJECT_ID /
  # VITE_FIREBASE_STORAGE_BUCKET / VITE_FIREBASE_MESSAGING_SENDER_ID /
  # VITE_FIREBASE_APP_ID / VITE_FIREBASE_MEASUREMENT_ID are set directly in
  # Netlify Site configuration > Environment variables (not here, to keep
  # Netlify's secrets scanner from flagging the literal value in this
  # committed file — see SECRETS_SCAN_OMIT_KEYS below for why the values
  # themselves are still fine to end up in the deployed JS bundle).
  # google-services.json's (Android) Firebase API key is likewise safe to
  # expose, but it still trips Netlify's secrets scanner since the whole repo
  # checkout gets scanned, not just the publish directory.
  SECRETS_SCAN_OMIT_PATHS = "artifacts/blank-react-app/android/app/google-services.json"
  # The VITE_FIREBASE_* values (set in the Netlify dashboard) are intentionally
  # baked into the client JS bundle (that's how Firebase web apps work) — tell
  # the scanner not to flag them as leaked secrets.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID"

[[redirects]]
  from = "/api/recipe/analyze"
  to = "/.netlify/functions/recipe-analyze"
  status = 200
  force = true

[[redirects]]
  from = "/api/recipe/chat"
  to = "/.netlify/functions/recipe-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/recipe/video-caption"
  to = "/.netlify/functions/video-caption"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
