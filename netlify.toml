[build]
  command = "pnpm --filter @workspace/blank-react-app run build"
  publish = "artifacts/blank-react-app/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"
  PORT = "18404"
  # google-services.json's Firebase API key is safe to expose client-side by
  # design (it's not a secret, just a project identifier), but it still trips
  # Netlify's secrets scanner since the whole repo checkout gets scanned.
  SECRETS_SCAN_OMIT_PATHS = "artifacts/blank-react-app/android/app/google-services.json"

[[redirects]]
  from = "/api/recipe/analyze"
  to = "/.netlify/functions/recipe-analyze"
  status = 200
  force = true

[[redirects]]
  from = "/api/recipe/chat"
  to = "/.netlify/functions/recipe-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/recipe/video-caption"
  to = "/.netlify/functions/video-caption"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
